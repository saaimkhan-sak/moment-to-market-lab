version: 1.1.0
query_policy: exact_full_name_validity_era_queries_only
false_positive_policy: retain article-level audit; abbreviations and informal aliases cannot form a quantified query alone
audit_evidence: data/evidence/gdelt_article_audit.csv
manual_audit_rubric:
  true_match:
    - the club is a principal subject, transaction participant, game participant, or materially discussed comparator
    - a multi-club article contains a substantive club-specific item
  false_match:
    - the club appears only in incidental career history, a footer, navigation, or an unrelated venue reference
    - the full-name string resolves to a non-NHL entity or copied keyword spam
  duplicate_policy: syndicated or duplicate URLs are reviewed individually because GDELT counts article observations
  evidence_review_basis: title, publisher, URL context, and article body when the first three are insufficient
  threshold: club-level and validity-query quantified use each require at least five reviewed articles and precision of at least 0.90
